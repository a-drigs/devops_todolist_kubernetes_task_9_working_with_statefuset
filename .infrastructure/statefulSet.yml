apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql-headless-service
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: HOST
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: HOST
        - name: USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: PASSWORD
        - name: NAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: NAME
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: pv-data
          mountPath: /var/lib/mysql
        - name: mysql-init-script
          mountPath: /docker-entrypoint-initdb.d
    volumes:
    - name: pv-data
      persistentVolumeClaim:
        claimName: pvc-data
    - name: mysql-init-script
      configMap:
        name: mysql-init-script
  livenessProbe:
    exec:
      command: ['mysqladmin', 'ping']
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command: ['mysqladmin', 'ping']
    initialDelaySeconds: 5
    periodSeconds: 2
    timeoutSeconds: 1